name: Build Windows executable

# Produces the shippable Windows artefacts. This is the supported way to get
# an .exe: the project is developed on Linux, and PyInstaller cannot
# cross-compile, so a real windows-latest runner does the freeze.
#
# Outputs (attached to every run, and to the release when tagged):
#   * SerialCommandConsole-portable.exe   single file, no install
#   * SerialCommandConsole-windows.zip    one-folder build (faster startup)
#   * SerialCommandConsole-<ver>-setup.exe Inno Setup installer

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Freeze on windows-latest
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests -q --cov=serial_console --cov-report=term-missing

      - name: Freeze with PyInstaller
        run: |
          pyinstaller packaging/serial_console.spec --noconfirm `
            --distpath packaging/dist --workpath packaging/build

      - name: Smoke-test the executable
        shell: pwsh
        run: |
          # --selftest exits 0 after wiring up the app without showing a window,
          # which catches missing hidden imports and data files.
          $exe = "packaging/dist/SerialCommandConsole/SerialCommandConsole.exe"
          & $exe --selftest
          if ($LASTEXITCODE -ne 0) { throw "Frozen app failed its self-test." }

      - name: Compile the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc packaging/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed." }

      - name: Package the folder build
        shell: pwsh
        run: |
          Compress-Archive -Path packaging/dist/SerialCommandConsole/* `
            -DestinationPath packaging/dist/SerialCommandConsole-windows.zip

      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: SerialCommandConsole-portable-exe
          path: packaging/dist/SerialCommandConsole-portable.exe
          if-no-files-found: error

      - name: Upload folder build
        uses: actions/upload-artifact@v4
        with:
          name: SerialCommandConsole-windows-folder
          path: packaging/dist/SerialCommandConsole-windows.zip
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SerialCommandConsole-installer
          path: packaging/installer_output/*.exe
          if-no-files-found: error

      - name: Attach artefacts to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            packaging/dist/SerialCommandConsole-portable.exe
            packaging/dist/SerialCommandConsole-windows.zip
            packaging/installer_output/*.exe

name: Feature request
description: Suggest an improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the workflow that is awkward today, not just the feature.
      placeholder: When I switch between two boards I have to re-enter the baud rate every time…
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: dropdown
    id: area
    attributes:
      label: Which part of the app?
      options:
        - Command buttons
        - Terminal / receive panel
        - Send panel and history
        - Profiles
        - Serial connection and settings
        - Export and logging
        - Appearance and themes
        - Packaging and installation
        - Other
    validations:
      required: true
